<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terjadi Kesalahan | Grand Aria Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="app-content">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="error-card">
                <i class="bi bi-exclamation-octagon-fill mb-3"></i>
                <h4 class="mb-2">Terjadi Kesalahan</h4>
                <p class="text-muted" th:text="${pesanError}"></p>
                <a th:href="@{/}" class="btn btn-hotel-primary mt-2">
                    <i class="bi bi-house-door me-1"></i>Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>
</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
