spring.application.name=ReservasiHotelApp

# Konfigurasi koneksi JDBC ke MySQL.
# createDatabaseIfNotExist=true membuat database db_reservasi_hotel
# secara otomatis kalau belum ada, jadi tidak perlu bikin manual di phpMyAdmin.
spring.datasource.url=jdbc:mysql://localhost:3306/db_reservasi_hotel?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Skema tabel sekarang dibuat lewat schema.sql + data.sql (kode SQL eksplisit),
# bukan lagi auto-generate Hibernate, supaya ada file .sql nyata yang bisa
# ditunjukkan/dijalankan. ddl-auto=none artinya Hibernate tidak ikut campur
# membuat/mengubah tabel.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jalankan schema.sql lalu data.sql secara OTOMATIS setiap kali aplikasi start.
# defer-datasource-initialization=true wajib diisi true supaya urutannya benar:
# Hibernate menyiapkan EntityManager dulu, baru schema.sql/data.sql dieksekusi.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Nonaktifkan cache Thymeleaf supaya perubahan template langsung terlihat saat development.
spring.thymeleaf.cache=false

# Paksa session tracking hanya lewat cookie (bukan URL rewriting ";jsessionid=...").
# Tanpa ini, redirect pertama sebelum cookie sempat di-set oleh browser akan
# menghasilkan Location: /;jsessionid=xxx yang gagal di-mapping oleh Spring MVC
# (muncul error "No static resource").
server.servlet.session.tracking-modes=cookie

server.port=8080
